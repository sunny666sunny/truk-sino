<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#0b1e36"/>
  <!-- Hexagonal emblem with Y negative space -->
  <polygon points="16,4 26,10 26,22 16,28 6,22 6,10" fill="#0b1e36"/>
  <polygon points="16,6 24,11 24,21 16,26 8,21 8,11" fill="#1a3a5c" stroke="#ffffff" stroke-width="0.5"/>
  <!-- Y-shape negative space -->
  <line x1="12" y1="10" x2="16" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="20" y1="10" x2="16" y2="16" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <line x1="16" y1="16" x2="16" y2="24" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <!-- Diamond accent -->
  <polygon points="16,7 18,10 16,13 14,10" fill="none" stroke="#ffffff" stroke-width="0.8"/>
  <!-- Orange accent stripe -->
  <rect x="0" y="27" width="32" height="5" fill="#e8580c"/>
</svg>
